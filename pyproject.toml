[project]
name = "oc-p8"
version = "0.1.0"
description = "MLOps pipeline for credit scoring model from OC_P6"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.136.1",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "lightgbm>=4.0.0",
    "matplotlib>=3.10.8",
    "mlflow>=2.0.0",
    "numpy>=2.4.3",
    "optuna>=3.0.0",
    "pandas==2.3.3",
    "plotly>=5.0.0",
    "pyarrow>=23.0.1",
    "pydantic>=2.13.3",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "shap>=0.46.0,!=0.51.0",
    "uvicorn[standard]>=0.46.0",
    "xgboost>=2.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "huggingface-hub>=1.14.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]
